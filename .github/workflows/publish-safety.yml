name: Publish safety

on: [push, pull_request]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test publishing checks
        run: python3 -m unittest discover -s tests -t . -p test_publish_safety.py
      - name: Check credentials, personal metadata and private paths
        run: python3 scripts/check_publish_safety.py --history
      - name: Download checksum-pinned Gitleaks
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" --directory "$RUNNER_TEMP" gitleaks
      - name: Scan full history with Gitleaks
        run: '"$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --max-decode-depth=2 --max-archive-depth=2 --log-opts="--all" .'
